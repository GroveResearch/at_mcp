name: check

# What runs, and when:
#
#   pull request   build: the release contract scripts, format, compile with
#                  warnings as errors and the async tests. test reports what
#                  build found; release reports success without running.
#                  This is the quick check a pull request needs to join the
#                  merge queue, not the evidence that it works.
#   merge queue    the whole suite, split across the suite jobs, with every
#                  gate's environment, the documentation and Hex package
#                  (package), and release (Linux), on the queued pull
#                  requests merged onto main; nothing is published. test
#                  passes only when build, every suite partition and package
#                  passed. Nothing reaches main without passing everything
#                  here, and main then moves to exactly the commit that
#                  passed, so main is not tested again (cache.yml only keeps
#                  main's dependency cache).
#   push a v* tag  release (Linux) and macos build the tagged commit as the
#                  tag's version, then publish both tarballs only if both
#                  passed, then the package goes to Hex only if that GitHub
#                  release was published. build, suite, package and test do
#                  not run: the commit already passed them in the merge queue.
#   on request     as in the merge queue, and macos; nothing is published
#
# Publishing is a deliberate act: CONTRIBUTING.md's "Publish a release"
# says how to push a tag. The tag is the version: a `vX.Y.Z` tag builds and
# publishes X.Y.Z (scripts/release_version.sh sets RELEASE_VERSION, which
# mix.exs reads), and nothing in the repository is changed to cut one.
# `release` and `macos` refuse any other tag, and a tag on a commit that is
# not on main or has no passing run of this workflow in the merge queue (or a
# requested run on main), before anything is built. Both advertised platforms must pass before a
# release can be created or updated.
# macOS runs only on a tag or on request because macOS runner minutes cost ten
# times Linux's.
#
# build, suite and package keep compiled dependencies between runs, keyed on
# mix.lock, because compiling them three times was most of a run. `release`,
# and the Hex package's consumer, start from nothing, as someone else running
# AtMcp would, so a lockfile or vendored patch that only works on a machine
# that already has the pieces is found before anything reaches main.
on:
  push:
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

# A newer push to a pull request cancels its run still going. A tag's run
# publishes, so it is not cancelled.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each job has a time limit well above its usual run (macOS takes under five
# minutes), so a hang fails in minutes instead of holding a runner.
jobs:
  # Format and compile with warnings as errors, as `mix check` does. On a pull
  # request, then the async tests: about 200 tests in seconds, while the rest
  # of the suite, almost all of it synchronous, waits for the merge queue. On
  # every other run, then the production release the release-gated tests run
  # against, built once and handed to every suite partition.
  build:
    if: github.ref_type != 'tag'
    # The same runner as the release job, so the release the suite tests is
    # built as the published one is: on the oldest Ubuntu GitHub still runs,
    # with the system OpenSSL the release job's notices name. ubuntu-latest
    # moves under us (it became 26.04, OpenSSL 3.5.5, and the release refused
    # to build without that notice). Moving the release to a newer Ubuntu is
    # its own change: the release job, these jobs and rel/notices together.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Verify release platform and baseline contracts
        run: |
          python3 scripts/release_platform_contract_test.py
          python3 scripts/published_release_test.py
          scripts/release_version_test.sh

      # The runtime is pinned to a version whose upstream license notices are
      # in rel/notices/, because the release refuses to build without them
      # (rel/notices.exs). "28" alone picks up each new OTP patch the day it
      # ships, before its notices are here. To move the runtime, add the new
      # otp-*/elixir-* notice sets and change these pins (every job) together.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.6"
          otp-version: "28.5.0.7"

      # The cache holds compiled dependencies only, for one runner image: the
      # key names the image the jobs below run on, and `_build/*/rel` is kept
      # out. A release left in a cached `_build` survived `mix release
      # --overwrite`, which keeps any erts file already there, so the suite
      # ran an erts built on a newer Ubuntu than this runner (#210).
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            !_build/*/rel
          key: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-

      - run: mix deps.get

      # AtMcp itself is always compiled whole, so `--warnings-as-errors` sees
      # every file and the native lock is built from this checkout.
      - run: rm -rf _build/*/lib/at_mcp _build/*/rel

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - name: The async tests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t files < <(grep -rlE --include='*_test.exs' 'use ExUnit\.Case.*async: true' test | sort)
          test "${#files[@]}" -gt 0
          mix test --warnings-as-errors "${files[@]}"

      # `--overwrite`: the cache restores `_build` with whatever release an
      # earlier run left in `_build/prod/rel`, and without a terminal
      # `mix release` takes its "Overwrite? [Yn]" prompt as no and keeps that
      # old release, so the suite tested an older server than this commit's
      # (#210's first merge-queue run).
      - name: Build the release the tests run
        if: github.event_name != 'pull_request'
        run: mix release --overwrite
        env:
          MIX_ENV: prod

      # Packed, because an artifact does not keep the executable bits.
      - name: Pack the release for the suite
        if: github.event_name != 'pull_request'
        run: tar -C _build/prod/rel -czf "$RUNNER_TEMP/test-release.tar.gz" at_mcp

      - name: Hand the release to the suite
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: test-release
          path: ${{ runner.temp }}/test-release.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The whole suite, in partitions that run at once: `mix test --partitions`
  # gives each one every Nth test file, in a fixed order, so together they run
  # every file once. Each partition gets every gate's environment: the
  # official MCP client packages, and the release build made, for the tests
  # that run one. Each job takes its partition from its index in the matrix
  # and N from the matrix's size, so every partition runs exactly once
  # whatever the list holds; list 1 to N to change N.
  suite:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    # The release job's runner, as build's: the suite runs that release.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      # Pinned with build's runtime; see the reason there.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.6"
          otp-version: "28.5.0.7"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
            !_build/*/rel
          key: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-

      - run: mix deps.get

      - run: rm -rf _build/*/lib/at_mcp _build/*/rel

      # The official client packages gate the independent MCP checks. Without
      # them those tests skip, which is the failure this job exists to catch.
      - name: Install the official MCP client packages
        run: |
          npm install --prefix "$RUNNER_TEMP/mcp" --ignore-scripts --no-audit --no-fund \
            @modelcontextprotocol/sdk@1.29.0 @modelcontextprotocol/client@2.0.0

      - uses: actions/download-artifact@v8
        with:
          name: test-release
          path: ${{ runner.temp }}

      - name: Unpack the release the tests run
        run: |
          rm -rf _build/prod/rel/at_mcp
          mkdir -p _build/prod/rel
          tar -C _build/prod/rel -xzf "$RUNNER_TEMP/test-release.tar.gz"

      - name: This partition of the suite, with every gate's environment
        shell: bash
        run: |
          set -o pipefail
          export MIX_TEST_PARTITION=$(( ${{ strategy.job-index }} + 1 ))
          mix test --warnings-as-errors --partitions ${{ strategy.job-total }} 2>&1 | tee "$RUNNER_TEMP/test.log"
        env:
          MIX_ENV: test
          MCP_SDK_PATH: ${{ runner.temp }}/mcp/node_modules/@modelcontextprotocol/sdk
          MCP_CLIENT_PATH: ${{ runner.temp }}/mcp/node_modules/@modelcontextprotocol/client
          TEST_ACCOUNT_RELEASE: ${{ github.workspace }}/_build/prod/rel/at_mcp
          TEST_CONNECT_RELEASE: ${{ github.workspace }}/_build/prod/rel/at_mcp/bin/at_mcp-connect

      # Every test that skips does so because its environment is missing, and
      # this job supplies all of it. A skip here means a package did not load
      # or a new gate was added without giving this job its environment. Either
      # way a skipped interoperability check would otherwise read as a pass.
      # Each partition checks its own tests; test requires every partition.
      - name: No test may have skipped
        shell: bash
        run: |
          summary=$(grep -E '^[0-9]+ tests?, [0-9]+ failures?' "$RUNNER_TEMP/test.log" | tail -n 1)
          echo "summary: $summary"
          if [ -z "$summary" ]; then
            echo "no ExUnit summary line found; the partition did not run to completion"
            exit 1
          fi
          if echo "$summary" | grep -qE '[1-9][0-9]* skipped'; then
            echo "tests skipped; every gate's environment is set here, so a skipped test is a failure"
            exit 1
          fi

  # The documentation, the Hex package used from a separate application (its
  # consumer compiles every dependency from nothing), and the README's download
  # and install commands run against a production release. The package
  # carries its version in VERSION, as the hex job writes it. It does not wait
  # for build: the documentation and the consumer take longer than a suite
  # partition, so this job builds its own release (seconds, from the cache)
  # rather than start a minute later with build's.
  package:
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    # The release job's runner, as build's: this job builds and runs a release.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Pinned with build's runtime; see the reason there.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.6"
          otp-version: "28.5.0.7"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
            !_build/*/rel
          key: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-

      - run: mix deps.get

      - run: rm -rf _build/*/lib/at_mcp _build/*/rel

      - name: Build documentation and the local Hex package
        run: |
          mix docs
          echo "0.0.0-dev" > VERSION
          mix hex.build
          rm VERSION
          python3 scripts/package_consumer_check.py at_mcp-*.tar

      - name: Install the official MCP client packages
        run: |
          npm install --prefix "$RUNNER_TEMP/mcp" --ignore-scripts --no-audit --no-fund \
            @modelcontextprotocol/sdk@1.29.0 @modelcontextprotocol/client@2.0.0

      # `--overwrite`, as in the build job: the cached `_build` may hold an
      # older release, which `mix release` would otherwise keep.
      - run: mix release --overwrite
        env:
          MIX_ENV: prod

      - name: Download without credentials and use the installed release
        env:
          MCP_CLIENT_PATH: ${{ runner.temp }}/mcp/node_modules/@modelcontextprotocol/client
          MCP_SDK_PATH: ${{ runner.temp }}/mcp/node_modules/@modelcontextprotocol/sdk
        run: python3 scripts/download_release_check.py _build/prod/rel/at_mcp

  # What a host's model receives from a read, through the host itself:
  # test/at_mcp/hosts_test.exs runs a read through the Claude Code CLI against
  # the running endpoint. It is tagged :hosts and left out of the suite,
  # because the CLI calls a model (haiku, the cheapest that calls the tool)
  # with the ANTHROPIC_API_KEY repository secret. Without the secret this job
  # says so and runs nothing. `test` does not wait for it.
  hosts:
    if: github.ref_type != 'tag'
    # On build's runner, to share its dependency cache, whose key names it.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Without the secret, say so and stop
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::notice title=hosts skipped::The ANTHROPIC_API_KEY secret is not set, so Claude Code cannot call a model and test/at_mcp/hosts_test.exs did not run."

      - uses: actions/checkout@v7
        if: env.ANTHROPIC_API_KEY != ''

      # Pinned with build's runtime; see the reason there.
      - uses: erlef/setup-beam@v1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          elixir-version: "1.19.6"
          otp-version: "28.5.0.7"

      - uses: actions/setup-node@v7
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: "22"

      - uses: actions/cache/restore@v6
        if: env.ANTHROPIC_API_KEY != ''
        with:
          path: |
            deps
            _build
            !_build/*/rel
          key: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ runner.os }}-ubuntu-22.04-otp28-elixir1.19-

      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm install --prefix "$RUNNER_TEMP/claude" --no-audit --no-fund \
            @anthropic-ai/claude-code@2.1.312
          echo "$RUNNER_TEMP/claude/node_modules/.bin" >> "$GITHUB_PATH"

      - name: A read through Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          mix deps.get
          mix test --only hosts test/at_mcp/hosts_test.exs

  # The required check. Branch protection requires `test` (and `release`), so
  # this job carries that name and passes only when everything that ran for
  # this event passed: build on a pull request; build, every suite partition
  # and package everywhere else. A failed, cancelled or skipped job it
  # expected fails it. It runs even when the run is cancelled (always()):
  # skipped, it would count as passing, and release may already have passed.
  test:
    needs: [build, suite, package]
    if: ${{ always() && github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Everything this event runs passed
        env:
          EVENT: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          SUITE: ${{ needs.suite.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "build: $BUILD, suite: $SUITE, package: $PACKAGE ($EVENT)"
          test "$BUILD" = success
          if [ "$EVENT" != pull_request ]; then
            test "$SUITE" = success
            test "$PACKAGE" = success
          fi

  # The linux-x86_64 release, built the way it is published and run as
  # docs/operations.md's "Run a shared service" says: in the foreground with every operator command
  # against it, and under the example systemd unit, upgraded to from the newest
  # published release and rolled back to it. Built on the oldest Ubuntu GitHub
  # still runs, because a release links the glibc it was built against and
  # refuses to start on an older one: Ubuntu 22.04, Debian 12 or later. On a
  # tag, the tarball that passed is published.
  #
  # Branch protection requires `release`. On a pull request it is skipped, which
  # GitHub counts as passing, and it runs in the merge queue before anything
  # reaches main. It runs beside the suite rather than after it: the queue
  # merges only when both pass, and a tag's run has no suite to wait for.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # actions: read lets a tag's run find the passing run of its commit.
    permissions:
      contents: read
      actions: read
    env:
      MIX_ENV: prod
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # On a tag, the version it publishes; nothing otherwise. A tag that is
      # not vX.Y.Z on a commit of main that passed this workflow stops here.
      - name: Take the version from the tag
        run: scripts/release_version.sh --from-green-main >> "$GITHUB_ENV"

      # Pinned with the test job's runtime; see the reason there.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.6"
          otp-version: "28.5.0.7"

      # Building must not depend on the operator's environment. config/runtime.exs
      # reads AT_MCP_* at boot, not at build, and this fails loudly if that ever
      # stops being true by making the build environment provably clean.
      - name: Confirm no AtMcp variables are set
        run: |
          if env | grep -q '^AT_MCP_'; then
            echo "the build environment has AT_MCP_ variables set; a release build must not need any"
            env | grep '^AT_MCP_'
            exit 1
          fi

      - run: mix deps.get

      - run: mix release --overwrite

      # On a tag, the release must be the tag's version.
      - name: Name the release and check it is the tag's version
        id: build
        run: |
          test "$(uname -m)" = x86_64
          version=$(cut -d' ' -f2 _build/prod/rel/at_mcp/releases/start_erl.data)
          if [ -n "${RELEASE_VERSION:-}" ] && [ "$version" != "$RELEASE_VERSION" ]; then
            echo "the tag is v$RELEASE_VERSION, but the release was built as $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm the release carries its executables
        run: scripts/release_executables_check.sh _build/prod/rel/at_mcp

      - name: Confirm the release boots without any AtMcp variables
        run: _build/prod/rel/at_mcp/bin/at_mcp eval 'IO.puts(Application.spec(:at_mcp, :vsn))'

      - name: Copy the release outside the source tree
        run: |
          rm -rf "$RUNNER_TEMP/at_mcp-release"
          cp -R _build/prod/rel/at_mcp "$RUNNER_TEMP/at_mcp-release"

      - run: python3 scripts/foreground_boot_check.py "$RUNNER_TEMP/at_mcp-release"

      # As root, because it installs the example unit in /etc/systemd/system,
      # makes the `at_mcp` user and writes /opt/at_mcp, /etc/at_mcp and
      # /var/lib/at_mcp, as docs/operations.md does on a server.
      - name: Upgrade from the newest published release and roll back, under the example systemd unit
        run: |
          old=$(python3 scripts/published_release.py linux-x86_64 "$RUNNER_TEMP/old")
          sudo --preserve-env=CI python3 scripts/upgrade_rollback_check.py --systemd \
            "$old" "$RUNNER_TEMP/at_mcp-release"

      # The tarball is named by version and holds one directory, `at_mcp-X.Y.Z`
      # (BUILD, inside it, still names the commit). It records root (0/0) as
      # every entry's owner, not the runner's uid, which
      # on a server may be a real account (scripts/tarball_owner_check.py).
      - name: Pack the release and check its owners
        id: pack
        run: |
          version=${{ steps.build.outputs.version }}
          name="at_mcp-${version}-linux-x86_64.tar.gz"
          stage="$RUNNER_TEMP/publish"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R _build/prod/rel/at_mcp "$stage/at_mcp-${version}"
          tar --owner=0 --group=0 --numeric-owner -C "$stage" -czf "$stage/$name" "at_mcp-${version}"
          python3 scripts/tarball_owner_check.py "$stage/$name"
          (cd "$stage" && shasum -a 256 "$name" > "$name.sha256" && cat "$name.sha256")
          echo "path=$stage/$name" >> "$GITHUB_OUTPUT"

      - name: Hand the Linux tarball to the publish job
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            ${{ steps.pack.outputs.path }}
            ${{ steps.pack.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 1

  # The macos-arm64 release (macos-14 runners are Apple silicon), run as
  # docs/operations.md's "Run a shared service" says: in the foreground with every operator command
  # against it, and under the example launchd plist, upgraded to from the
  # newest published release and rolled back to it. On a tag, the tarball that
  # passed is published only when Linux passed too.
  macos:
    needs: test
    if: ${{ !cancelled() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')) }}
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      MIX_ENV: prod
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # As in release: a bad tag stops here, before anything is built.
      - name: Take the version from the tag
        run: scripts/release_version.sh --from-green-main >> "$GITHUB_ENV"

      # Pinned with the test job's runtime; see the reason there.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.6"
          otp-version: "28.5.0.7"

      - name: Confirm no AtMcp variables are set
        run: |
          if env | grep -q '^AT_MCP_'; then
            echo "the build environment has AT_MCP_ variables set; a release build must not need any"
            env | grep '^AT_MCP_'
            exit 1
          fi

      - run: mix deps.get

      - run: mix release --overwrite

      # On a tag, the release must be the tag's version.
      - name: Name the release and check it is the tag's version
        id: build
        run: |
          test "$(uname -m)" = arm64
          version=$(cut -d' ' -f2 _build/prod/rel/at_mcp/releases/start_erl.data)
          if [ -n "${RELEASE_VERSION:-}" ] && [ "$version" != "$RELEASE_VERSION" ]; then
            echo "the tag is v$RELEASE_VERSION, but the release was built as $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm the release carries its executables
        run: scripts/release_executables_check.sh _build/prod/rel/at_mcp

      # A Mac that receives this release may have no Homebrew. The runtime
      # erlef/setup-beam installs on macOS carries OpenSSL inside crypto.so,
      # while an Erlang built against Homebrew's openssl@3 (as a local
      # `brew install erlang` is) links /opt/homebrew and fails to load crypto
      # anywhere else. Every native library and runtime binary here may link
      # only the system's own libraries.
      - name: Confirm the release links nothing outside macOS itself
        shell: bash
        run: |
          rel=_build/prod/rel/at_mcp
          bad=0
          while IFS= read -r f; do
            # A library lists its own install name among what it links; that
            # is not a dependency. A NIF bundle has none.
            self=$(otool -D "$f" | tail -n +2)
            outside=$(otool -L "$f" | tail -n +2 | awk '{print $1}' |
              grep -v -x -F -e "${self:-/nonexistent}" | grep -v -e '^/usr/lib/' -e '^/System/' || true)
            if [ -n "$outside" ]; then
              echo "$f links: $outside"; bad=1
            fi
          done < <(find "$rel" -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          [ "$bad" = 0 ] || exit 1

      - name: Confirm the release boots without any AtMcp variables
        run: _build/prod/rel/at_mcp/bin/at_mcp eval 'IO.puts(Application.spec(:at_mcp, :vsn))'

      - name: Copy the release outside the source tree
        run: |
          rm -rf "$RUNNER_TEMP/at_mcp-release"
          cp -R _build/prod/rel/at_mcp "$RUNNER_TEMP/at_mcp-release"

      - run: plutil -lint rel/examples/li.example.at_mcp.plist

      - run: python3 scripts/foreground_boot_check.py "$RUNNER_TEMP/at_mcp-release"

      - name: Upgrade from the newest published release and roll back, under the example launchd plist
        run: |
          old=$(python3 scripts/published_release.py macos-arm64 "$RUNNER_TEMP/old")
          python3 scripts/upgrade_rollback_check.py --launchd "$old" "$RUNNER_TEMP/at_mcp-release"

      # As on Linux. bsdtar spells root ownership --uid/--gid; COPYFILE_DISABLE
      # keeps macOS metadata (._ entries) out.
      - name: Pack the release and check its owners
        id: pack
        run: |
          version=${{ steps.build.outputs.version }}
          name="at_mcp-${version}-macos-arm64.tar.gz"
          stage="$RUNNER_TEMP/publish"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R _build/prod/rel/at_mcp "$stage/at_mcp-${version}"
          COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --numeric-owner -C "$stage" -czf "$stage/$name" "at_mcp-${version}"
          python3 scripts/tarball_owner_check.py "$stage/$name"
          (cd "$stage" && shasum -a 256 "$name" > "$name.sha256" && cat "$name.sha256")
          echo "path=$stage/$name" >> "$GITHUB_OUTPUT"

      - name: Hand the macOS tarball to the publish job
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            ${{ steps.pack.outputs.path }}
            ${{ steps.pack.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 1

  # A tag publishes the complete pair of advertised platforms. Failed,
  # cancelled, skipped or missing builds cannot create or overwrite a release.
  # A successful rerun can replace assets only after both platforms pass again.
  publish:
    needs: [release, macos]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the tag's release
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          files=(
            "artifacts/at_mcp-${tag#v}-linux-x86_64.tar.gz"
            "artifacts/at_mcp-${tag#v}-linux-x86_64.tar.gz.sha256"
            "artifacts/at_mcp-${tag#v}-macos-arm64.tar.gz"
            "artifacts/at_mcp-${tag#v}-macos-arm64.tar.gz.sha256"
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing release asset: $file"; exit 1; }
          done
          notes="AtMcp ${tag#v}, built from $GITHUB_SHA.
          - linux-x86_64: Ubuntu 22.04, Debian 12 or later
          - macos-arm64: Apple silicon

          To run it: see the README."
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber
            gh release edit "$tag" --repo "$repo" --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" --repo "$repo" --verify-tag \
              --title "AtMcp ${tag#v}" --notes "$notes"
          fi

  # The Hex package and its docs, from the tagged commit, once its GitHub
  # release is published, as the tag's version. The package carries that
  # version in VERSION, so an application depending on it compiles it as the
  # version it asked for. HEX_API_KEY is a Hex key that can publish this
  # package, kept in the `hex` environment, which only v* tags can use.
  hex:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hex
    steps:
      - uses: actions/checkout@v7

      # Pinned with the test job's runtime; see the reason there.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.6"
          otp-version: "28.5.0.7"

      - run: mix deps.get

      - name: Write the tag's version into the package
        run: |
          scripts/release_version.sh | cut -d= -f2 > VERSION
          test -s VERSION

      # The package at the tag's version, used from a separate application
      # before it is published. The merge queue checked this commit's package
      # as 0.0.0-dev; test does not run on a tag.
      - name: Build the package and use it from a separate application
        run: |
          mix hex.build
          python3 scripts/package_consumer_check.py at_mcp-*.tar
          rm at_mcp-*.tar

      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
